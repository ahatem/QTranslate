name: Plugin Smoke Test

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test-all-plugins:
    name: Load and exercise all plugins
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run all-plugin smoke test
        shell: pwsh
        run: ./gradlew.bat smokeTestAllPlugins --no-daemon --console=plain

      - name: Upload plugin smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-smoke-report
          path: build/plugin-smoke-test/report.txt
          if-no-files-found: ignore
          retention-days: 7
