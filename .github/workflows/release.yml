name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows-package:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build full distribution
        shell: pwsh
        # The property must be quoted: PowerShell otherwise splits the argument at the
        # first dot, passing Gradle a bogus ".3.0" task name and failing the build.
        run: ./gradlew assemblePortable "-PreleaseVersion=${{ steps.version.outputs.version }}" --no-daemon
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Assemble portable Windows app image
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packageVersion = ($version -split '-')[0]
          $portableArchive = "build/release/QTranslate-$version.zip"

          Expand-Archive -LiteralPath $portableArchive -DestinationPath portable-distribution
          New-Item -ItemType Directory -Force package-input | Out-Null
          Copy-Item portable-distribution/QTranslate/QTranslate.jar package-input/QTranslate.jar

          # jlink only includes modules listed here. Providers loaded reflectively via
          # ServiceLoader (JCA crypto, locale data) are invisible to static analysis, so
          # they must be requested explicitly or they silently vanish from the runtime.
          $modules = @(
            'java.base', 'java.desktop', 'java.instrument', 'java.logging',
            'java.management', 'java.naming', 'java.net.http', 'java.prefs',
            'java.security.jgss', 'java.xml.crypto', 'jdk.charsets', 'jdk.unsupported',
            # SunEC provider. Without it every ECDHE/ECDSA TLS handshake fails, which
            # breaks all network services ("EC KeyPairGenerator not available").
            'jdk.crypto.ec',
            # Locale data for the 13 bundled languages. Without it the JDK falls back to
            # ROOT/English number, date, and display-name formatting.
            'jdk.localedata',
            # ZIP FileSystem provider. Not required by the app itself, but bundled plugins
            # are third-party code that may rely on it; the module costs ~100 KB.
            'jdk.zipfs'
          ) -join ','
          jlink `
            --add-modules $modules `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --strip-native-commands `
            --compress=2 `
            --output qtranslate-runtime

          jpackage `
            --type app-image `
            --name QTranslate `
            --input package-input `
            --main-jar QTranslate.jar `
            --main-class com.github.ahatem.qtranslate.app.MainKt `
            --app-version $packageVersion `
            --icon ui-swing/src/main/resources/icons/app/icon.ico `
            --runtime-image qtranslate-runtime `
            --dest windows-package `
            --java-options '-Dfile.encoding=UTF-8'

          Copy-Item portable-distribution/QTranslate/plugins windows-package/QTranslate/plugins -Recurse
          Copy-Item portable-distribution/QTranslate/languages windows-package/QTranslate/languages -Recurse
          Copy-Item portable-distribution/QTranslate/themes windows-package/QTranslate/themes -Recurse
          Compress-Archive -Path windows-package/QTranslate -DestinationPath "QTranslate-$version-windows-x64.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: qtranslate-windows-x64
          path: QTranslate-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: windows-package

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release variants
        run: ./gradlew assembleReleaseVariants "-PreleaseVersion=${{ steps.version.outputs.version }}" --no-daemon
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: qtranslate-windows-x64
          path: build/release

      - name: Add Windows checksum
        run: |
          cd build/release
          sha256sum "QTranslate-${{ steps.version.outputs.version }}-windows-x64.zip" >> SHA256SUMS.txt

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          # Categorize commits by Conventional Commit type
          FEATURES=$(git log --pretty=format:"%s" $RANGE | grep -E "^feat(\(.+\))?:" | sed 's/^feat[^:]*: /- /' || true)
          FIXES=$(git log --pretty=format:"%s" $RANGE | grep -E "^fix(\(.+\))?:" | sed 's/^fix[^:]*: /- /' || true)
          REFACTORS=$(git log --pretty=format:"%s" $RANGE | grep -E "^refactor(\(.+\))?:" | sed 's/^refactor[^:]*: /- /' || true)
          DOCS=$(git log --pretty=format:"%s" $RANGE | grep -E "^docs(\(.+\))?:" | sed 's/^docs[^:]*: /- /' || true)
          CHORES=$(git log --pretty=format:"%s" $RANGE | grep -E "^(chore|ci|build)(\(.+\))?:" | sed 's/^[^:]*: /- /' || true)
          OTHER=$(git log --pretty=format:"%s" $RANGE | grep -vE "^(feat|fix|refactor|docs|chore|ci|build)(\(.+\))?:" | sed 's/^/- /' || true)

          # Build categorized log
          LOG=""
          [ -n "$FEATURES" ]  && LOG="${LOG}### New features\n${FEATURES}\n\n"
          [ -n "$FIXES" ]     && LOG="${LOG}### Bug fixes\n${FIXES}\n\n"
          [ -n "$REFACTORS" ] && LOG="${LOG}### Improvements\n${REFACTORS}\n\n"
          [ -n "$DOCS" ]      && LOG="${LOG}### Documentation\n${DOCS}\n\n"
          [ -n "$CHORES" ]    && LOG="${LOG}### Maintenance\n${CHORES}\n\n"
          [ -n "$OTHER" ]     && LOG="${LOG}### Other\n${OTHER}\n\n"

          # Fall back to flat log if no conventional commits found
          if [ -z "$LOG" ]; then
            LOG=$(git log --pretty=format:"- %s" $RANGE)
          fi

          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          printf "%b" "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: QTranslate ${{ steps.version.outputs.version }}
          body: |
            ## What's changed

            ${{ steps.changelog.outputs.log }}

            ---

            **Full changelog:** https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md

            ## Downloads

            | Download | Who it is for | Java needed |
            |---|---|---|
            | **[⬇ Windows (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/QTranslate-${{ steps.version.outputs.version }}-windows-x64.zip)** | **Start here on Windows.** Extract and run `QTranslate.exe`. | No — runtime included |
            | **[⬇ Portable (all platforms)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/QTranslate-${{ steps.version.outputs.version }}.zip)** | macOS, Linux, or Windows without an installer. Extract and run `QTranslate.jar`. | Java 11+ |
            | **[⬇ App only (.jar)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/QTranslate-App-${{ steps.version.outputs.version }}.jar)** | No plugins. For custom setups and plugin development. | Java 11+ |

            The portable ZIP already contains every bundled plugin. The individual
            plugin JARs in the assets below are only needed to add or update a single
            plugin in an existing installation — most users can ignore them.

            ## Verification

            Optional. Download [SHA256SUMS.txt](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS.txt)
            into the same folder as your download and run:
            ```
            sha256sum -c SHA256SUMS.txt
            ```

          files: |
            build/release/QTranslate-App-${{ steps.version.outputs.version }}.jar
            build/release/QTranslate-${{ steps.version.outputs.version }}.zip
            build/release/QTranslate-${{ steps.version.outputs.version }}-windows-x64.zip
            build/release/plugins/*.jar
            build/release/release-metadata.json
            build/release/SIZE_REPORT.md
            build/release/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          draft: false
