name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Linux native headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev pkg-config

      # `build` runs `test` as part of `check`, so there is no separate test step. QInput is
      # resolved from Maven Central with its native libraries bundled in the jar, so
      # QInput-dependent tests (e.g. AbiBindingTest, QInputBackendMappingTest) exercise the real
      # native library instead of skipping.
      - name: Build and test all modules
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # The Ubuntu runners that build the release variants cannot compile Swift, so the Vision helper is
  # built once on a macOS runner and handed over. Without it they would validate a plugin JAR that is
  # missing a resource the released artifact carries.
  macos-helper:
    name: Build macOS Vision helper
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build universal Vision helper
        run: ./gradlew :plugins:system-ocr:buildMacVisionHelper --no-daemon

      - name: Upload Vision helper
        uses: actions/upload-artifact@v7
        with:
          name: macos-vision-ocr
          path: plugins/system-ocr/build/generated/mac-helper-build/vision_ocr
          if-no-files-found: error
          retention-days: 7

  release-variants:
    name: Release variant (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: macos-helper
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: app-only
            task: assembleAppOnly
          - variant: portable
            task: validateReleaseSizes
          - variant: plugins
            task: assembleIndividualPlugins

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS Vision helper
        uses: actions/download-artifact@v8
        with:
          name: macos-vision-ocr
          path: macos-helper

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Linux native headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev pkg-config

      - name: Build ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} -PreleaseVersion=ci -PmacVisionHelper=macos-helper/vision_ocr --no-daemon

      - name: Upload ${{ matrix.variant }}
        uses: actions/upload-artifact@v7
        with:
          name: qtranslate-${{ matrix.variant }}
          path: build/release/
          if-no-files-found: error
          retention-days: 7
