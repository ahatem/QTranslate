name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'SPONSORS.md'
      - 'docs/**'
      - 'wiki/**'
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Linux native headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev pkg-config

      # `build` runs `test` as part of `check`, so there is no separate test step. QInput is
      # resolved from Maven Central with its native libraries bundled in the jar, so
      # QInput-dependent tests (e.g. AbiBindingTest, QInputBackendMappingTest) exercise the real
      # native library instead of skipping.
      - name: Build and test all modules
        run: ./gradlew build --no-daemon

      - name: Test release class-version verifier
        run: ./gradlew -p buildSrc test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # The Ubuntu runners that build the release variants cannot compile Swift, so the Vision helper is
  # built once on a macOS runner and handed over. Without it they would validate a plugin JAR that is
  # missing a resource the released artifact carries.
  macos-helper:
    name: Build macOS helpers
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build universal macOS helpers
        run: ./gradlew :plugins:system-services:buildMacVisionHelper :plugins:system-services:buildMacSpellHelper --no-daemon

      - name: Upload Vision helper
        uses: actions/upload-artifact@v7
        with:
          name: macos-vision-ocr
          path: plugins/system-services/build/generated/mac-helper-build/vision_ocr
          if-no-files-found: error
          retention-days: 7

      - name: Upload spell helper
        uses: actions/upload-artifact@v7
        with:
          name: macos-system-spell
          path: plugins/system-services/build/generated/mac-spell-build/system_spell
          if-no-files-found: error
          retention-days: 7

  release-variants:
    name: Release variant (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: macos-helper
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: app-only
            task: assembleAppOnly
            verification: validateAppOnlyClassVersions
          - variant: portable
            task: validateReleaseSizes
            verification: validatePortableClassVersions
          - variant: plugins
            task: assembleIndividualPlugins
            verification: validateStandalonePluginClassVersions

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS Vision helper
        uses: actions/download-artifact@v8
        with:
          name: macos-vision-ocr
          path: macos-helper

      - name: Download macOS spell helper
        uses: actions/download-artifact@v8
        with:
          name: macos-system-spell
          path: macos-helper

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Linux native headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev pkg-config

      - name: Build ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} ${{ matrix.verification }} -PmacVisionHelper=macos-helper/vision_ocr -PmacSpellHelper=macos-helper/system_spell --no-daemon

      - name: Upload ${{ matrix.variant }}
        uses: actions/upload-artifact@v7
        with:
          name: qtranslate-${{ matrix.variant }}
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  portable-runtime:
    name: Portable runtime (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: release-variants
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - name: Download assembled portable candidate
        uses: actions/download-artifact@v8
        with:
          name: qtranslate-portable
          path: candidate

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Check extracted portable candidate
        run: |
          archive=(candidate/QTranslate-*.zip)
          test "${#archive[@]}" -eq 1
          candidate_dir="$(mktemp -d)"
          unzip -q "${archive[0]}" -d "$candidate_dir"
          test -f "$candidate_dir/QTranslate/portable-plugin-ids.txt"
          timeout 120s java -Djava.awt.headless=true -cp "$candidate_dir/QTranslate/QTranslate.jar" \
            com.github.ahatem.qtranslate.app.ReleaseArtifactProbeKt \
            "$candidate_dir/QTranslate"

  windows-candidate:
    name: Windows app image candidate
    runs-on: windows-latest
    needs: release-variants
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download assembled portable candidate
        uses: actions/download-artifact@v8
        with:
          name: qtranslate-portable
          path: candidate

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Package with the release script
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem candidate/QTranslate-*.zip)
          if ($archive.Count -ne 1) { throw 'Expected exactly one portable candidate' }
          $version = $archive[0].BaseName.Substring('QTranslate-'.Length)
          "version=$version" >> $env:GITHUB_ENV
          ./.github/scripts/package-windows.ps1 -Version $version -PortableArchive $archive[0].FullName -OutputDirectory build/windows-candidate

      - name: Verify bundled runtime and packaged launcher
        shell: pwsh
        run: ./.github/scripts/verify-windows-package.ps1 -Version $env:version -PackageDirectory build/windows-candidate

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v7
        with:
          name: qtranslate-windows-candidate
          path: build/windows-candidate/QTranslate-${{ env.version }}-windows-x64.zip
          if-no-files-found: error

  release-inventory:
    name: Verify complete release inventory
    runs-on: ubuntu-latest
    needs: [macos-helper, windows-candidate]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Linux native headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev pkg-config
      - uses: actions/download-artifact@v8
        with:
          name: macos-vision-ocr
          path: macos-helper
      - uses: actions/download-artifact@v8
        with:
          name: macos-system-spell
          path: macos-helper
      - name: Assemble release variants
        run: ./gradlew assembleReleaseVariants -PmacVisionHelper=macos-helper/vision_ocr -PmacSpellHelper=macos-helper/system_spell --no-daemon
      - uses: actions/download-artifact@v8
        with:
          name: qtranslate-windows-candidate
          path: build/release
      - name: Verify exact artifacts and checksums
        run: |
          cd build/release
          sha256sum QTranslate-*-windows-x64.zip >> SHA256SUMS.txt
          cd ../..
          ./gradlew verifyReleaseArtifacts -PrequireWindowsArtifact=true -PrequireMacHelpers=true --no-daemon

  macos-candidate:
    name: macOS portable candidate
    runs-on: macos-14
    needs: release-variants
    timeout-minutes: 15

    steps:
      - name: Download assembled portable candidate
        uses: actions/download-artifact@v8
        with:
          name: qtranslate-portable
          path: candidate

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Probe packaged app and universal helpers
        run: |
          set -euo pipefail
          candidate_dir="$(mktemp -d)"
          archive=(candidate/QTranslate-*.zip)
          test "${#archive[@]}" -eq 1
          unzip -q "${archive[0]}" -d "$candidate_dir"
          root="$candidate_dir/QTranslate"
          python3 - "$root" <<'PY'
          import os
          import subprocess
          import sys
          root = sys.argv[1]
          subprocess.run([
              "java", "-Djava.awt.headless=true", "-cp", os.path.join(root, "QTranslate.jar"),
              "com.github.ahatem.qtranslate.app.ReleaseArtifactProbeKt", root,
          ], check=True, timeout=120)
          PY
          plugin="$root/plugins/system-services-plugin.jar"
          for helper in vision_ocr system_spell; do
            binary="$candidate_dir/$helper"
            unzip -p "$plugin" "native/macos/$helper" > "$binary"
            test -s "$binary"
            lipo -archs "$binary" | grep -qw arm64
            lipo -archs "$binary" | grep -qw x86_64
          done
