name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make QTranslate better? Great! Please describe it below.

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which part of the app does this affect?
      options:
        - UI / UX
        - Translation
        - Plugin system
        - Core / Architecture
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation or pain point you're experiencing.
      placeholder: "I often need to... but currently I have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Be as specific as you can.
      placeholder: "Add a button that... / When I do X, the app should..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, or workarounds you currently use.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, references — anything that helps.
