max_retries_info = "Jumlah percobaan tambahan setelah percobaan pertama gagal. Hanya permintaan yang aman untuk dikirim dua kali yang diulang: meminta terjemahan lagi aman jika layanan menolaknya, tetapi tidak jika layanan mungkin sudah melakukan pekerjaannya."
