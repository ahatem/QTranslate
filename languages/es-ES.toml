socket_timeout_info = "El intervalo máximo permitido entre dos fragmentos de datos. Se reinicia con cada llegada, así que una respuesta lenta pero continua nunca lo activa. Detecta un servicio que acepta la conexión y luego se queda en silencio."
max_retries_info = "Cuántos intentos más tras el primero fallido. Solo se repiten las solicitudes seguras de enviar dos veces: pedir de nuevo una traducción es seguro cuando el servicio la rechazó, y no lo es cuando ya pudo haber hecho el trabajo."
retry_delay_info = "Cuánto esperar antes de reintentar. Cada intento posterior espera el doble que el anterior, con un poco de aleatoriedad para que varios servicios no reintenten al mismo tiempo. Si el servicio indica cuánto esperar, se respeta."
per_host_connections_info = "Cuántas conexiones puede haber abiertas a un servicio a la vez. Más no es más rápido y puede provocar límites de peticiones. El límite es aproximado: una ráfaga repentina puede superarlo brevemente."
total_connections_info = "Cuántas conexiones puede haber abiertas en total entre todos los servicios. Solo importa si usa muchos servicios a la vez."
retry_hint = "Solo se reintentan las solicitudes seguras de repetir. Una solicitud con límite de peticiones siempre se reintenta, y si un servicio pide una pausa, se espera."
