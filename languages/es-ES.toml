request_timeout_info = "Toda la llamada, desde el envío hasta la respuesta. Es un límite global, no la suma de los dos siguientes: se ejecutan dentro de él. Si es menor que alguno, ese nunca se activará. Auméntelo para un modelo local de IA, que responde al instante a nivel de red y luego piensa."
