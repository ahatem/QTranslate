connect_timeout_info = "Apenas a abertura da conexão com o serviço. Termina no momento em que a conexão é estabelecida, antes de qualquer tradução, então não precisa ser longo. Um serviço inativo ou bloqueado falha aqui."
socket_timeout_info = "O intervalo máximo permitido entre dois trechos de dados. É reiniciado cada vez que algo chega, então uma resposta lenta que continua chegando aos poucos nunca o aciona. Isso detecta um serviço que aceita a conexão e depois fica em silêncio."
max_retries_info = "Quantas novas tentativas após a falha da primeira. Somente solicitações seguras para enviar duas vezes são repetidas: pedir uma tradução novamente é seguro quando o serviço a recusou, e não é quando o serviço já pode ter feito o trabalho."
retry_delay_info = "Quanto tempo esperar antes de tentar novamente. Cada tentativa seguinte espera o dobro da anterior, com um pouco de aleatoriedade para que vários serviços falhando juntos não tentem de novo no mesmo instante. Se o serviço indicar quanto tempo esperar, esse tempo é respeitado."
per_host_connections_info = "Quantas conexões podem estar abertas com um serviço ao mesmo tempo. Mais não é mais rápido e pode causar limitação de taxa. O limite é aproximado: uma rajada repentina pode excedê-lo brevemente."
total_connections_info = "Quantas conexões podem estar abertas com todos os serviços ao mesmo tempo. Só importa se você usar muitos serviços simultaneamente."
retry_hint = "Somente solicitações seguras para repetir são repetidas. Uma solicitação limitada por taxa é sempre repetida, e um serviço pedindo para ser deixado em paz por um tempo é aguardado."
