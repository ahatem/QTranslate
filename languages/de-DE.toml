request_timeout_info = "Der gesamte Aufruf, vom Senden der Anfrage bis zur Antwort. Dies ist ein Gesamtlimit, nicht die Summe der beiden Werte darunter: Diese laufen darin ab. Ist das Limit kleiner als einem davon, kann dieses nie auslösen. Erhöhen Sie es für ein lokales KI-Modell, das auf Netzwerkebene sofort antwortet und dann nachdenkt."
connect_timeout_info = "Nur der Verbindungsaufbau zum Dienst. Er endet, sobald die Verbindung steht, bevor übersetzt wird, und muss daher nicht lang sein. Ein ausgefallener oder blockierter Dienst scheitert hier."
socket_timeout_info = "Die längste zulässige Lücke zwischen zwei Datenteilen. Sie wird bei jedem eintreffenden Stück zurückgesetzt, sodass eine langsame, aber stetig eintreffende Antwort sie nie auslöst. Damit werden Dienste erkannt, die die Verbindung annehmen und dann schweigen."
max_retries_info = "Wie viele weitere Versuche nach dem ersten Fehlschlag unternommen werden. Nur Anfragen, die gefahrlos zweimal gesendet werden können, werden wiederholt: Eine Übersetzung erneut anzufragen ist unbedenklich, wenn der Dienst sie abgelehnt hat, aber nicht, wenn er die Arbeit bereits erledigt haben könnte."
retry_delay_info = "Wie lange vor dem nächsten Versuch gewartet wird. Jeder weitere Versuch wartet doppelt so lange wie der vorherige, mit etwas Zufälligkeit, damit nicht mehrere gleichzeitig fehlschlagende Dienste im selben Moment erneut versuchen. Wenn der Dienst angibt, wie lange gewartet werden soll, wird dies befolgt."
per_host_connections_info = "Wie viele Verbindungen zu einem Dienst gleichzeitig offen sein dürfen. Mehr ist nicht schneller und kann zu einer Ratenbegrenzung führen. Das Limit ist ungefähr: Eine plötzliche Häufung kann es kurz überschreiten."
total_connections_info = "Wie viele Verbindungen über alle Dienste hinweg gleichzeitig offen sein dürfen. Nur relevant, wenn Sie viele Dienste gleichzeitig nutzen."
retry_hint = "Nur Anfragen, die gefahrlos wiederholt werden können, werden wiederholt. Eine ratenbegrenzte Anfrage wird immer wiederholt, und wenn ein Dienst um eine Pause bittet, wird diese abgewartet."
