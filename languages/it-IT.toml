host_timeouts_info = "Assegna a un particolare servizio il proprio timeout per l'intera richiesta. Si tratta di un modello di intelligenza artificiale locale, che può richiedere alcuni minuti per rispondere al punto in cui un servizio cloud verrebbe considerato morto. Per ogni host viene impostato solo il timeout dell'intera richiesta; la connessione e l'attesa dei dati mantengono i valori condivisi, poiché ciò che è lento in un modello locale è quanto tempo pensa, non la rete ad esso collegata."
host_column = "Host"
seconds_column = "Secondi"
