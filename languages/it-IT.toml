envelope_warning = "L'intera richiesta è %ss, più corta della %ss sottostante. L'impostazione più lunga non può mai avere effetto perché viene eseguita all'interno dell'intera richiesta anziché dopo di essa."
retry_group = "Ritentativi"
retry_enabled = "Riprova richieste non riuscite"
max_retries = "Tentativi successivi al primo:"
retry_delay = "Primo tentativo dopo:"
request_timeout_info = "Tutta la chiamata, dall'invio della richiesta alla risposta. Questo è un limite complessivo, non la somma dei due sottostanti: essi corrono al suo interno. Se questo è più piccolo di uno dei due, quello non potrà mai essere eseguito. Aumentalo per un modello di intelligenza artificiale locale, che risponde immediatamente a livello di rete e poi pensa."
connect_timeout_info = "Solo aprendo la connessione al servizio. Termina nel momento in cui la connessione viene stabilita, prima che avvenga qualsiasi traduzione, quindi non è necessario che sia lungo. Un servizio non attivo o bloccato in questo caso fallisce."
socket_timeout_info = "L'intervallo più lungo consentito tra due dati. Si ripristina ogni volta che arriva qualcosa, quindi una risposta lenta che continua a funzionare non lo farà mai cadere. Questo rileva un servizio che accetta la connessione e poi diventa silenzioso."
max_retries_info = "Quanti ulteriori tentativi dopo il primo che fallisce. Vengono ripetute solo le richieste che è sicuro inviare due volte: chiedere nuovamente una traduzione è sicuro quando il servizio l'ha rifiutata e non lo è quando il servizio potrebbe aver già svolto il lavoro."
retry_delay_info = "Quanto aspettare prima di riprovare. Ogni tentativo successivo attende il doppio del tempo precedente, con l'aggiunta di un po' di casualità in modo che diversi servizi che falliscono insieme non riprovino tutti nello stesso istante. Se il servizio dice quanto tempo aspettare, viene invece rispettata tale indicazione."
per_host_connections_info = "Quante connessioni possono essere aperte contemporaneamente a un servizio. Con più connessioni non è più veloce e può comportare una limitazione del traffico dati. Il limite è approssimativo: un burst dati può superarlo per breve tempo."
total_connections_info = "Quante connessioni possono essere aperte contemporaneamente in ogni servizio. Importa solo se usi più servizi contemporaneamente."
retry_hint = "Vengono ritentate solo le richieste che è sicuro ripetere. Viene sempre ritentata una richiesta a velocità limitata e si attende per un servizio che chiede di essere lasciato solo per un po'"
