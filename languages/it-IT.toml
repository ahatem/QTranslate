per_host_connections = "Un servizio alla volta:"
total_connections = "In totale:"
connections_hint = "L'apertura di molte connessioni a un servizio non lo rende più veloce e può comportare una limitazione del traffico dati. Il limite è approssimativo."
applies_group = "Applicazione modifiche"
applies_hint = "Le impostazioni di rete si applicano alle richieste effettuate dopo che sono state salvate. Se un servizio sembra usare le vecchie impostazioni riavvia QTranslate."
