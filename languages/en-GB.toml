host_timeouts_info = "Give a particular service its own whole-request timeout. This is for a local AI model, which can take minutes to answer where a cloud service would be considered dead. Only the whole-request timeout is set per host; connecting and waiting-for-data keep the shared values, since what is slow about a local model is how long it thinks, not the network to it."
host_column = "Host"
seconds_column = "Seconds"
host_add = "Add"
host_remove = "Remove"
# %1$s = the whole-request timeout, %2$s = the larger of the other two
envelope_warning = "Whole request is %ss, shorter than the %ss below it. The longer setting can never take effect, because it runs inside the whole request rather than after it."
retry_group = "Retries"
retry_enabled = "Retry failed requests"
max_retries = "Attempts after the first:"
retry_delay = "First retry after:"
request_timeout_info = "The whole call, from sending the request to having the reply. This is an overall limit, not the sum of the two below it: they run inside it. If this is smaller than either of them, that one can never fire. Raise this for a local AI model, which answers instantly at the network level and then thinks."
connect_timeout_info = "Only opening the connection to the service. It ends the moment the connection is up, before any translating happens, so it does not need to be long. A service that is down or blocked fails here."
socket_timeout_info = "The longest gap allowed between two pieces of data. It resets every time something arrives, so a slow reply that keeps trickling in never trips it. This catches a service that accepts the connection and then goes quiet."
max_retries_info = "How many further attempts after the first one fails. Only requests that are safe to send twice are repeated: asking for a translation again is safe when the service refused it, and is not when the service may already have done the work."
retry_delay_info = "How long to wait before trying again. Each attempt after that waits twice as long as the one before, with a little randomness added so that several services failing together do not all retry in the same instant. If the service says how long to wait, that is obeyed instead."
per_host_connections_info = "How many connections may be open to one service at the same time. More is not faster and can get you rate limited. The limit is approximate: a sudden burst may briefly exceed it."
total_connections_info = "How many connections may be open across every service at once. Only matters if you use many services simultaneously."
retry_hint = "Only requests that are safe to repeat are retried. A rate-limited request is always retried, and a service asking to be left alone for a while is waited out."
connections_group = "Connections"
per_host_connections = "To one service at a time:"
total_connections = "In total:"
connections_hint = "Opening many connections to one service does not make it faster and can get you rate limited. The limit is approximate."
applies_group = "Applying changes"
applies_hint = "Network settings apply to requests made after they are saved. Restart QTranslate if a service seems to be using the old settings."
