max_retries = "Počet pokusů po prvním selhání:"
retry_delay = "První opakování po:"
request_timeout_info = "Celý hovor, od odeslání požadavku až po přijetí odpovědi. Toto je celkový limit, nikoli součet dvou parametrů níže – ty běží uvnitř něj. Pokud je tato hodnota menší než kterákoli z nich, daný limit se nikdy nespustí. Zvyšte tuto hodnotu u lokálních AI modelů, které se síťově propojí okamžitě, ale pak dlouho generují text."
connect_timeout_info = "Pouze čas na otevření spojení se službou. Končí v okamžiku, kdy je spojení navázáno, ještě před začátkem samotného překládání, takže nemusí být dlouhý. Služba, která je vypnutá nebo blokovaná, selže právě zde."
socket_timeout_info = "Nejdelší povolená pauza mezi dvěma bloky dat. Resetuje se pokaždé, když dorazí jakákoliv nová část dat, takže pomalá odpověď, která přichází postupně po kapkách, tento limit nikdy nepřekročí. Zachytí to situaci, kdy služba přijme spojení a pak přestane komunikovat."
max_retries_info = "Kolik dalších pokusů se má provést po selhání prvního. Opakují se pouze požadavky, které je bezpečné poslat dvakrát: požádat o překlad znovu je bezpečné, pokud jej služba odmítla, ale není to bezpečné ve chvíli, kdy služba už na úkolu mohla začít pracovat."
retry_delay_info = "Jak dlouho čekat před dalším pokusem. Každý další pokus čeká dvakrát déle než ten předchozí, s trochou náhodnosti, aby několik selhávajících služeb nezačalo opakovat požadavky přesně ve stejný okamžik. Pokud sama služba uvádí, jak dlouho se má čekat, má to přednost."
per_host_connections_info = "Kolik spojení může být otevřeno k jedné službě současně. Více spojení neznamená vyšší rychlost a může vést k zablokování kvůli překročení limitů (rate limiting). Limit je přibližný: náhlý nápor ho může krátkodobě překročit."
total_connections_info = "Kolik spojení může být otevřeno napříč wszystkými službami najednou. Záleží na tom pouze v případě, že používáte mnoho služeb současně."
retry_hint = "Opakují se pouze požadavky, které je bezpečné provést znovu. Požadavek odmítnutý kvůli přetížení (rate-limited) je zopakován vždy a na požadavek služby, abychom ji chvíli nechali být, se počká."
connections_group = "Síťová spojení"
per_host_connections = "K jedné službě současně:"
total_connections = "Celkem:"
connections_hint = "Otevírání mnoha spojení k jedné službě nezrychlí překlad a může vést k zablokování vašeho přístupu. Tento limit je přibližný."
applies_group = "Použití změn"
applies_hint = "Nastavení sítě se vztahuje na požadavky odeslané až po uložení změn. Pokud se zdá, že některá služba stále používá staré nastavení, restartujte QTranslate."

